name: Test and rehearse
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run rehearse -- demo:safe --out=safe-report.json
      - run: npm run rehearse -- demo:snapshot --repair --out=repaired-report.json
      - name: Require unsafe rollback to fail the gate
        run: |
          set +e
          npm run rehearse -- demo:snapshot --out=blocked-report.json
          result=$?
          test "$result" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-evidence
          path: '*-report.json'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test private workspaces
        run: |
          npm start > /tmp/undoproof-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail http://127.0.0.1:3001/api/health && break
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:3001 E2E_WITH_AUTH=1 npx playwright test --grep 'private account'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t undoproof:check .
      - name: Container startup smoke test
        run: |
          docker run -d --name undoproof-check -e NODE_ENV=development -p 3000:3000 undoproof:check
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/api/health; then
              curl --fail http://127.0.0.1:3000/
              exit 0
            fi
            sleep 1
          done
          docker logs undoproof-check
          exit 1
